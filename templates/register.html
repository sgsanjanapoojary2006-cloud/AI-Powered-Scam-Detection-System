
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AI Scam Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="logo">🛡️</div>
        <h1>SCAM<span>GUARD</span></h1>
        <p class="subtitle">AI-Powered Scam Detection System</p>

        <h2>Create Account</h2>
        <p class="description">Join us to stay safer online.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Minimum 8 characters" minlength="8" required>

            <button type="submit">CREATE ACCOUNT</button>
        </form>

        <p class="switch-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>

</body>
</html>
